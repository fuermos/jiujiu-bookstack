# jiujiu-bookstack 一键启动
#
# 首次使用:
#   1. cp config/config.example.yaml config/config.yaml  # 填 API Key
#   2. docker-compose up -d                              # 起服务 (PG + app + web)
#   3. 浏览器访问 http://localhost:8501                   # 打开 Web UI 玩剧本杀
#
# 命令行玩剧本杀:
#   docker-compose exec app python agent/deep_agent.py --book-id 1 --interactive
#
# 跑流水线 (导入 epub):
#   docker-compose exec app python scripts/pipeline.py /app/books/

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jiujiu-postgres
    environment:
      POSTGRES_PASSWORD: changeme
      POSTGRES_USER: admin
      POSTGRES_DB: jiujiu_mind
    ports:
      - "15433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/init_db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d jiujiu_mind"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: jiujiu-bookstack:latest
    container_name: jiujiu-bookstack-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres          # 容器内走服务名
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: changeme
      DB_NAME: jiujiu_mind
      LLM_PRIMARY_API_KEY: ${LLM_PRIMARY_API_KEY:-}
    volumes:
      - ./config:/app/config             # 配置（含 config.yaml）
      - ./books:/app/books               # 书库
      - ./mindmaps:/app/mindmaps         # 思维导图产物
      - ./tts:/app/tts                   # TTS 音频产物
      - ./data:/app/data                 # 敏词库等运行数据
      - ./logs:/app/logs
    # 默认 sleep 保持容器存活, 用 exec 进去跑命令
    command: ["sleep", "infinity"]

  web:
    image: jiujiu-bookstack:latest    # 复用 app 镜像（代码一致）
    container_name: jiujiu-bookstack-web
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started    # 等 app 起, 但不强求健康
    environment:
      LLM_PRIMARY_API_KEY: ${LLM_PRIMARY_API_KEY:-}
    volumes:
      # 用 docker 专用配置 (host: postgres) 覆盖到容器内，不污染宿主的 config.yaml
      - ./config/config-docker.yaml:/app/config/config.yaml:ro
      # 其他数据仍共享
      - ./config/sensitive_words.json:/app/config/sensitive_words.json:ro
      - ./config/category_rules.yaml:/app/config/category_rules.yaml:ro
      - ./config/init_db.sql:/app/config/init_db.sql:ro
      - ./books:/app/books
      - ./mindmaps:/app/mindmaps
      - ./tts:/app/tts
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8501:8501"                   # 对外映射：宿主 8501 → 容器 8501
    command: >
      streamlit run web/app.py
        --server.port 8501
        --server.address 0.0.0.0
        --server.headless true
        --browser.gatherUsageStats false

volumes:
  pgdata: