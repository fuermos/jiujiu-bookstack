# jiujiu-bookstack 配置示例
# 复制为 config.yaml 后填实际值
# 敏感字段（API Key / DB Password）建议用环境变量覆盖

# ====== 大模型配置 ======
llm:
  primary:
    name: anthropic-main           # 自定义名字，用于日志
    provider: anthropic             # anthropic / openai / ollama
    base_url: https://api.anthropic.com
    api_key: "YOUR_API_KEY_HERE"    # ← 填这里（也可设环境变量 LLM_PRIMARY_API_KEY）
    model: claude-sonnet-4-5
  fallback:
    - name: openai-backup
      provider: openai
      base_url: https://api.openai.com/v1
      api_key: sk-xxxxx
      model: gpt-4o-mini
    - name: ollama-local
      provider: ollama
      base_url: http://localhost:11434/v1
      api_key: ollama                 # 本地无需 Key
      model: qwen2.5-72b

# ===== 在线模式预设 (主人 2026-08-29 钦定备用) =====
# 本地 LM Studio (192.168.0.14:2345) 被占时, 把 primary 换成云端,
# fallback 链顺延. 恢复时反过来改回 local-lmstudio 即可.
#
# 推荐组合 (主 qwen-long + 备 minimax-M3):
#   primary:
#     name: qwen-long-dashscope
#     provider: openai
#     base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
#     api_key: sk-xxxxx            # 阿里 DashScope API Key
#     model: qwen-long              # 1M context, 中文场景覆盖优秀
#   fallback:
#     - name: minimax-anthropic
#       provider: anthropic
#       base_url: https://api.minimaxi.com/anthropic
#       api_key: ""                  # LLM_MINIMAX_ANTHROPIC_API_KEY env
#       model: MiniMax-M3
#
# 经验: 主人 2026-08-29 实测 qwen-long 比 minimax-M3 在剧本生成/SKILL 质量
# 上明显更好 (Chapter Index + Anti-Patterns 是 qwen 独有), 价格也更低

# ====== 向量配置 ======
embedding:
  base_url: http://localhost:1234/v1   # 本地 LM Studio 或 OpenAI
  api_key: lm-studio                   # 本地免 Key
  model: text-embedding-bge-m3
  dimensions: 1024
  # 也可用 OpenAI:
  # base_url: https://api.openai.com/v1
  # api_key: sk-xxxxx
  # model: text-embedding-3-small
  # dimensions: 1536

# ====== 数据库配置 ======
database:
  host: localhost
  port: 15433
  user: admin
  password: your-password           # 也可设 DB_PASSWORD 环境变量
  dbname: jiujiu_mind

# ====== Pipeline 配置 ======
pipeline:
  chunk_size: 1000            # 每 chunk 目标字符数
  chunk_overlap: 100          # chunk 之间重叠
  tts_voice: zh-CN-YunxiNeural  # edge-tts 音色
  embed_batch_size: 50        # 批量向量化大小
  default_game_type: v2_mixed  # v2_cyoa / v2_mixed

# ====== MCP 配置 ======
mcp:
  transport: stdio             # stdio / sse
  port: 8765                  # SSE 模式端口
